<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Uyushmachi.uz production architecture</title>
  <desc id="description">A tenant-scoped command workflow with human confirmation, audit logging and no direct model access to the database.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#e9f2ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#0d4fc4"/>
    </marker>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #12213c; }
      .label { font-size: 15px; font-weight: 800; letter-spacing: 1.2px; fill: #0d4fc4; }
      .title { font-size: 24px; font-weight: 800; }
      .body { font-size: 16px; fill: #50627b; }
      .green { fill: #079b58; }
      .footer { fill: #ffffff; }
      .card { fill: #ffffff; stroke: #cedbec; stroke-width: 2; }
      .flow { fill: none; stroke: #0d4fc4; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="720" rx="30" fill="url(#bg)"/>
  <text x="64" y="70" font-size="34" font-weight="850">Safe AI command workflow</text>
  <text x="64" y="104" class="body">Every request is authorized, tenant-scoped and audited on the server.</text>

  <rect class="card" x="64" y="170" width="230" height="150" rx="22"/>
  <text x="90" y="210" class="label">01 - REQUEST</text>
  <text x="90" y="250" class="title">Association leader</text>
  <text x="90" y="282" class="body">Plain-language command</text>

  <rect class="card" x="360" y="170" width="230" height="150" rx="22"/>
  <text x="386" y="210" class="label">02 - GUARD</text>
  <text x="386" y="250" class="title">Server authorization</text>
  <text x="386" y="282" class="body">Role + associationId</text>

  <rect class="card" x="656" y="170" width="230" height="150" rx="22"/>
  <text x="682" y="210" class="label">03 - INTERPRET</text>
  <text x="682" y="250" class="title">Command engine</text>
  <text x="682" y="282" class="body">Intent, entity and risk</text>

  <rect class="card" x="952" y="170" width="184" height="150" rx="22"/>
  <text x="978" y="210" class="label">04 - RESULT</text>
  <text x="978" y="250" class="title">Read or preview</text>
  <text x="978" y="282" class="body">No silent writes</text>

  <path class="flow" d="M294 245H350"/>
  <path class="flow" d="M590 245H646"/>
  <path class="flow" d="M886 245H942"/>

  <rect class="card" x="360" y="410" width="230" height="160" rx="22"/>
  <text x="386" y="450" class="label">TENANT DATA</text>
  <text x="386" y="490" class="title">PostgreSQL</text>
  <text x="386" y="522" class="body">Scoped queries only</text>
  <text x="386" y="548" class="body">Encrypted private files</text>

  <rect x="656" y="410" width="230" height="160" rx="22" fill="#effbf5" stroke="#9dd7bb" stroke-width="2"/>
  <text x="682" y="450" class="label green">HUMAN CONTROL</text>
  <text x="682" y="490" class="title">Confirm write</text>
  <text x="682" y="522" class="body">Immutable transaction</text>
  <text x="682" y="548" class="body">Append-only audit event</text>

  <path class="flow" d="M475 320V400"/>
  <path class="flow" d="M1044 320V365H771V400"/>
  <path class="flow" d="M656 490H600"/>

  <rect x="64" y="628" width="1072" height="44" rx="14" fill="#12213c"/>
  <text x="600" y="656" class="footer" text-anchor="middle" font-size="16" font-weight="700">The AI model never receives unrestricted database access or production credentials.</text>
</svg>
